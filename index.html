<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratory Asset Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">AMS <span>Asset Management System</span></div>
    <button id="logoutBtn" class="btn danger hidden">Logout</button>
  </header>

  <main class="container">
    <section id="loginView" class="card auth-card">
      <h1>Sign in</h1>
      <p class="muted">Laboratory Asset Transaction and Approval Management</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required></label>
        <label>Password<input id="password" type="password" required></label>
        <button class="btn primary" type="submit">Sign In</button>
        <p id="loginMsg" class="message"></p>
      </form>
    </section>

    <section id="appView" class="hidden">
      <div class="welcome card">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="userInfo" class="muted"></p>
        </div>
      </div>

      <nav id="nav" class="nav card"></nav>

      <section id="dashboard" class="view"></section>
      <section id="equipment" class="view hidden"></section>
      <section id="borrowing" class="view hidden"></section>
      <section id="maintenance" class="view hidden"></section>
      <section id="users" class="view hidden"></section>
      <section id="audit" class="view hidden"></section>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
